<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>Tests - Air Scanner</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            padding: 30px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .test {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: #1f2937;
        }

        .success {
            border-left: 5px solid #22c55e;
        }

        .failure {
            border-left: 5px solid #ef4444;
        }

        .summary {
            margin-top: 25px;
            padding: 15px;
            background: #374151;
            border-radius: 6px;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <h1>Air Scanner — Tests</h1>

    <div id="results"></div>

    <div id="summary" class="summary"></div>


<script>

/* =========================================================
   OUTILS DE TEST
   ========================================================= */

let testsTotal = 0;
let testsPassed = 0;
let testsFailed = 0;


function test(nom, fonction) {

    testsTotal++;

    const result = document.createElement("div");

    result.className = "test";


    try {

        fonction();

        testsPassed++;

        result.classList.add("success");

        result.innerHTML =
            `✓ ${nom}`;

    } catch (error) {

        testsFailed++;

        result.classList.add("failure");

        result.innerHTML =
            `✗ ${nom}<br>
             <small>${error.message}</small>`;

    }


    document
        .getElementById("results")
        .appendChild(result);
}


function expect(condition, message) {

    if (!condition) {

        throw new Error(message);

    }

}


/* =========================================================
   COPIE DE LA FONCTION À TESTER
   ========================================================= */

const altitudeColors = [

    { altitude: 0,     color: [244, 91, 10] },
    { altitude: 500,   color: [244, 91, 10] },
    { altitude: 1000,  color: [244, 127, 10] },
    { altitude: 2000,  color: [249, 185, 26] },
    { altitude: 4000,  color: [242, 214, 0] },
    { altitude: 6000,  color: [169, 208, 0] },
    { altitude: 8000,  color: [43, 197, 27] },
    { altitude: 10000, color: [20, 187, 154] },
    { altitude: 20000, color: [28, 188, 210] },
    { altitude: 30000, color: [77, 71, 229] },
    { altitude: 40000, color: [224, 0, 207] }

];


function couleurSelonAltitude(altitude) {

    if (altitude >= 40000) {

        const c =
            altitudeColors[
                altitudeColors.length - 1
            ].color;

        return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;

    }


    if (altitude <= 0) {

        const c =
            altitudeColors[0].color;

        return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;

    }


    for (
        let i = 0;
        i < altitudeColors.length - 1;
        i++
    ) {

        const min = altitudeColors[i];
        const max = altitudeColors[i + 1];


        if (
            altitude >= min.altitude &&
            altitude <= max.altitude
        ) {

            const ratio =
                (altitude - min.altitude) /
                (max.altitude - min.altitude);


            const r = Math.round(
                min.color[0] +
                (max.color[0] - min.color[0]) *
                ratio
            );


            const g = Math.round(
                min.color[1] +
                (max.color[1] - min.color[1]) *
                ratio
            );


            const b = Math.round(
                min.color[2] +
                (max.color[2] - min.color[2]) *
                ratio
            );


            return `rgb(${r}, ${g}, ${b})`;

        }

    }


    return "gray";

}


/* =========================================================
   TESTS
   ========================================================= */


/* ---------------------------------------------------------
   ALTITUDE 0
   --------------------------------------------------------- */

test(
    "Altitude 0 → couleur minimale",
    () => {

        expect(
            couleurSelonAltitude(0)
            === "rgb(244, 91, 10)",
            "La couleur de l'altitude 0 est incorrecte."
        );

    }
);


/* ---------------------------------------------------------
   ALTITUDE 500
   --------------------------------------------------------- */

test(
    "Altitude 500 → couleur minimale",
    () => {

        expect(
            couleurSelonAltitude(500)
            === "rgb(244, 91, 10)",
            "La couleur de 500 ft est incorrecte."
        );

    }
);


/* ---------------------------------------------------------
   ALTITUDE 1 000
   --------------------------------------------------------- */

test(
    "Altitude 1 000 → couleur orange",
    () => {

        expect(
            couleurSelonAltitude(1000)
            === "rgb(244, 127, 10)",
            "La couleur de 1 000 ft est incorrecte."
        );

    }
);


/* ---------------------------------------------------------
   ALTITUDE 10 000
   --------------------------------------------------------- */

test(
    "Altitude 10 000 → couleur turquoise",
    () => {

        expect(
            couleurSelonAltitude(10000)
            === "rgb(20, 187, 154)",
            "La couleur de 10 000 ft est incorrecte."
        );

    }
);


/* ---------------------------------------------------------
   ALTITUDE 20 000
   --------------------------------------------------------- */

test(
    "Altitude 20 000 → couleur cyan",
    () => {

        expect(
            couleurSelonAltitude(20000)
            === "rgb(28, 188, 210)",
            "La couleur de 20 000 ft est incorrecte."
        );

    }
);


/* ---------------------------------------------------------
   ALTITUDE 30 000
   --------------------------------------------------------- */

test(
    "Altitude 30 000 → couleur bleue",
    () => {

        expect(
            couleurSelonAltitude(30000)
            === "rgb(77, 71, 229)",
            "La couleur de 30 000 ft est incorrecte."
        );

    }
);


/* ---------------------------------------------------------
   ALTITUDE 40 000
   --------------------------------------------------------- */

test(
    "Altitude 40 000 → couleur maximale",
    () => {

        expect(
            couleurSelonAltitude(40000)
            === "rgb(224, 0, 207)",
            "La couleur de 40 000 ft est incorrecte."
        );

    }
);


/* ---------------------------------------------------------
   AU-DESSUS DE 40 000
   --------------------------------------------------------- */

test(
    "Altitude > 40 000 → couleur maximale",
    () => {

        expect(
            couleurSelonAltitude(45000)
            === "rgb(224, 0, 207)",
            "Une altitude supérieure à 40 000 devrait garder la couleur maximale."
        );

    }
);


/* ---------------------------------------------------------
   ALTITUDE NÉGATIVE
   --------------------------------------------------------- */

test(
    "Altitude négative → couleur minimale",
    () => {

        expect(
            couleurSelonAltitude(-100)
            === "rgb(244, 91, 10)",
            "Une altitude négative devrait utiliser la couleur minimale."
        );

    }
);


/* ---------------------------------------------------------
   VALEUR INTERMÉDIAIRE
   --------------------------------------------------------- */

test(
    "Altitude intermédiaire → interpolation",
    () => {

        const couleur =
            couleurSelonAltitude(5000);

        expect(
            couleur.startsWith("rgb("),
            "La fonction doit retourner une couleur RGB."
        );

    }
);


/* =========================================================
   RÉSUMÉ
   ========================================================= */

document.getElementById("summary").innerHTML = `

    ${testsTotal} tests exécutés<br>

    <span style="color:#22c55e">
        ${testsPassed} réussis
    </span>

    &nbsp; | &nbsp;

    <span style="color:#ef4444">
        ${testsFailed} échecs
    </span>

`;

</script>

</body>

</html>
