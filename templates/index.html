<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Air Scanner</title>


    <!-- =========================
         LEAFLET
         ========================= -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- =========================
         STYLE
         ========================= -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family: Arial, sans-serif;

            background: #111827;
        }


        /* =========================
           APPLICATION
           ========================= */

        .app {

            display: flex;

            width: 100%;
            height: 100vh;
        }


        /* =========================
           PANNEAU GAUCHE
           ========================= */

        .sidebar {

            width: 25%;
            height: 100%;

            background: #1f2937;

            color: white;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           PARAMÈTRES
           ========================= */

        .settings {

            flex: 0 0 auto;

            padding: 25px;

            border-bottom: 1px solid #374151;
        }


        .title {

            margin: 0 0 25px 0;

            font-size: 28px;
        }


        .field {

            margin-bottom: 15px;
        }


        .field label {

            display: block;

            margin-bottom: 6px;

            font-size: 13px;

            color: #9ca3af;
        }


        .field input {

            width: 100%;

            padding: 10px;

            border: none;
            border-radius: 6px;

            background: #374151;

            color: white;

            font-size: 15px;
        }


        .field input:focus {

            outline: 2px solid #2563eb;
        }


        /* =========================
           BOUTON
           ========================= */

        .scan-button {

            width: 100%;

            margin-top: 5px;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #2563eb;

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }


        .scan-button:hover {

            background: #1d4ed8;
        }


        .scan-button:active {

            background: #1e40af;
        }


        /* =========================
           LISTE DES AVIONS
           ========================= */

        .aircraft-panel {

            flex: 1;

            padding: 20px;

            overflow-y: auto;
        }


        .aircraft-title {

            margin-top: 0;

            margin-bottom: 15px;

            font-size: 20px;
        }


        .aircraft-list {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .aircraft {

            padding: 12px;

            background: #374151;

            border-radius: 6px;

            cursor: pointer;

            transition: background 0.15s;
        }


        .aircraft:hover {

            background: #4b5563;
        }


        .aircraft-callsign {

            font-weight: bold;

            font-size: 15px;
        }


        .aircraft-info {

            margin-top: 5px;

            font-size: 12px;

            line-height: 1.5;

            color: #d1d5db;
        }


        /* =========================
           CARTE
           ========================= */

        .map-container {

            width: 75%;
            height: 100%;
        }


        #map {

            width: 100%;
            height: 100%;
        }


        /* =========================
           ICÔNE AVION
           ========================= */

        .avion-icon {

            background: transparent;

            border: none;
        }


        .avion-image {

            width: 40px;
            height: 40px;

            background-color: black;

            mask-image: url("/static/Avion.png");
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;

            -webkit-mask-image: url("/static/Avion.png");
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;

            transform-origin: center center;
        }

        /* =========================================================
        ÉCHELLE D'ALTITUDE
        ========================================================= */

        .altitude-legend {

            background: rgba(31, 41, 55, 0.92);

            padding: 5px 10px 5px 10px;

            border-radius: 6px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.35);

            color: white;

            font-family: Arial, sans-serif;

            width: 800px;

            overflow: hidden;
        }


        /* =========================================================
        BARRE DE COULEUR
        ========================================================= */

        .altitude-gradient {

            position: relative;

            width: 100%;
            height: 10px;

            border: 2px solid #111;

            background: linear-gradient(
                to right,

                rgb(244, 91, 10) 0%,
                rgb(244, 91, 10) 3.5%,

                rgb(244, 127, 10) 7%,

                rgb(249, 185, 26) 14%,

                rgb(242, 214, 0) 21.5%,

                rgb(169, 208, 0) 28.5%,

                rgb(43, 197, 27) 35.5%,

                rgb(20, 187, 154) 42.5%,

                rgb(28, 188, 210) 57.5%,

                rgb(77, 71, 229) 78%,

                rgb(224, 0, 207) 100%
            );
        }


        /* =========================================================
        TRAITS VERTICAUX
        ========================================================= */

        .altitude-tick {

            position: absolute;

            top: 0;

            width: 2px;
            height: 100%;

            background: #111;

            transform: translateX(-50%);
        }


        /* =========================================================
        VALEURS
        ========================================================= */

        .altitude-labels {

            position: relative;

            width: 100%;

            height: 10px;

            margin-top: 8px;

            font-size: 12px;

            font-weight: bold;

            color: white;

            white-space: nowrap;
        }


        .altitude-label {

            position: absolute;

            top: 0;

            transform: translateX(-50%);

            white-space: nowrap;
        }


        /* Première valeur */

        .altitude-label.first {

            left: 0%;

            transform: translateX(0);
        }


        /* Dernière valeur */

        .altitude-label.last {

            left: 100%;

            transform: translateX(-100%);
        }


    </style>

</head>


<body>


<div class="app">


    <!-- ==================================================
         PANNEAU GAUCHE
         ================================================== -->

    <aside class="sidebar">


        <!-- ==================================================
             PARAMÈTRES
             ================================================== -->

        <section class="settings">

            <h1 class="title">
                Air Scanner
            </h1>


            <!-- Latitude -->

            <div class="field">

                <label for="latitude">
                    Latitude
                </label>

                <input
                    id="latitude"
                    type="number"
                    step="any"
                    placeholder="48.8566"
                >

            </div>


            <!-- Longitude -->

            <div class="field">

                <label for="longitude">
                    Longitude
                </label>

                <input
                    id="longitude"
                    type="number"
                    step="any"
                    placeholder="2.3522"
                >

            </div>


            <!-- Radius -->

            <div class="field">

                <label for="radius">
                    Radius (km)
                </label>

                <input
                    id="radius"
                    type="number"
                    step="any"
                    placeholder="100"
                >

            </div>


            <!-- Bouton -->

            <button
                class="scan-button"
                onclick="demarrerActualisation()"
            >
                LANCER LE SCAN
            </button>

        </section>


        <!-- ==================================================
             LISTE DES AVIONS
             ================================================== -->

        <section class="aircraft-panel">

            <h2 class="aircraft-title">
                Avions
            </h2>


            <div
                id="aircraft-list"
                class="aircraft-list"
            >

                <div>
                    Aucun avion chargé.
                </div>

            </div>

        </section>


    </aside>


    <!-- ==================================================
         CARTE
         ================================================== -->

    <main class="map-container">

        <div id="map"></div>

    </main>


</div>
<script src="/static/js/app.js"></script>

</body>

</html>
