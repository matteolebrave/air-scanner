<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Air Scanner</title>


    <!-- =========================
         LEAFLET
         ========================= -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- =========================
         STYLE
         ========================= -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family: Arial, sans-serif;

            background: #111827;
        }


        /* =========================
           APPLICATION
           ========================= */

        .app {

            display: flex;

            width: 100%;
            height: 100vh;
        }


        /* =========================
           PANNEAU GAUCHE
           ========================= */

        .sidebar {

            width: 25%;
            height: 100%;

            background: #1f2937;

            color: white;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           PARAMÈTRES
           ========================= */

        .settings {

            flex: 0 0 auto;

            padding: 25px;

            border-bottom: 1px solid #374151;
        }


        .title {

            margin: 0 0 25px 0;

            font-size: 28px;
        }


        .field {

            margin-bottom: 15px;
        }


        .field label {

            display: block;

            margin-bottom: 6px;

            font-size: 13px;

            color: #9ca3af;
        }


        .field input {

            width: 100%;

            padding: 10px;

            border: none;
            border-radius: 6px;

            background: #374151;

            color: white;

            font-size: 15px;
        }


        .field input:focus {

            outline: 2px solid #2563eb;
        }


        /* =========================
           BOUTON
           ========================= */

        .scan-button {

            width: 100%;

            margin-top: 5px;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #2563eb;

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }


        .scan-button:hover {

            background: #1d4ed8;
        }


        .scan-button:active {

            background: #1e40af;
        }


        /* =========================
           LISTE DES AVIONS
           ========================= */

        .aircraft-panel {

            flex: 1;

            padding: 20px;

            overflow-y: auto;
        }


        .aircraft-title {

            margin-top: 0;

            margin-bottom: 15px;

            font-size: 20px;
        }


        .aircraft-list {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .aircraft {

            padding: 12px;

            background: #374151;

            border-radius: 6px;

            cursor: pointer;

            transition: background 0.15s;
        }


        .aircraft:hover {

            background: #4b5563;
        }


        .aircraft-callsign {

            font-weight: bold;

            font-size: 15px;
        }


        .aircraft-info {

            margin-top: 5px;

            font-size: 12px;

            line-height: 1.5;

            color: #d1d5db;
        }


        /* =========================
           CARTE
           ========================= */

        .map-container {

            width: 75%;
            height: 100%;
        }


        #map {

            width: 100%;
            height: 100%;
        }


        /* =========================
           ICÔNE AVION
           ========================= */

        .avion-icon {

            background: transparent;

            border: none;
        }


        .avion-image {

            width: 40px;
            height: 40px;

            background-color: black;

            mask-image: url("/static/Avion.png");
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;

            -webkit-mask-image: url("/static/Avion.png");
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;

            transform-origin: center center;
        }

        /* =========================================================
        ÉCHELLE D'ALTITUDE
        ========================================================= */

        .altitude-legend {

            background: rgba(31, 41, 55, 0.92);

            padding: 5px 10px 5px 10px;

            border-radius: 6px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.35);

            color: white;

            font-family: Arial, sans-serif;

            width: 800px;

            overflow: hidden;
        }


        /* =========================================================
        BARRE DE COULEUR
        ========================================================= */

        .altitude-gradient {

            position: relative;

            width: 100%;
            height: 10px;

            border: 2px solid #111;

            background: linear-gradient(
                to right,

                rgb(244, 91, 10) 0%,
                rgb(244, 91, 10) 3.5%,

                rgb(244, 127, 10) 7%,

                rgb(249, 185, 26) 14%,

                rgb(242, 214, 0) 21.5%,

                rgb(169, 208, 0) 28.5%,

                rgb(43, 197, 27) 35.5%,

                rgb(20, 187, 154) 42.5%,

                rgb(28, 188, 210) 57.5%,

                rgb(77, 71, 229) 78%,

                rgb(224, 0, 207) 100%
            );
        }


        /* =========================================================
        TRAITS VERTICAUX
        ========================================================= */

        .altitude-tick {

            position: absolute;

            top: 0;

            width: 2px;
            height: 100%;

            background: #111;

            transform: translateX(-50%);
        }


        /* =========================================================
        VALEURS
        ========================================================= */

        .altitude-labels {

            position: relative;

            width: 100%;

            height: 10px;

            margin-top: 8px;

            font-size: 12px;

            font-weight: bold;

            color: white;

            white-space: nowrap;
        }


        .altitude-label {

            position: absolute;

            top: 0;

            transform: translateX(-50%);

            white-space: nowrap;
        }


        /* Première valeur */

        .altitude-label.first {

            left: 0%;

            transform: translateX(0);
        }


        /* Dernière valeur */

        .altitude-label.last {

            left: 100%;

            transform: translateX(-100%);
        }


    </style>

</head>


<body>


<div class="app">


    <!-- ==================================================
         PANNEAU GAUCHE
         ================================================== -->

    <aside class="sidebar">


        <!-- ==================================================
             PARAMÈTRES
             ================================================== -->

        <section class="settings">

            <h1 class="title">
                Air Scanner
            </h1>


            <!-- Latitude -->

            <div class="field">

                <label for="latitude">
                    Latitude
                </label>

                <input
                    id="latitude"
                    type="number"
                    step="any"
                    placeholder="48.8566"
                >

            </div>


            <!-- Longitude -->

            <div class="field">

                <label for="longitude">
                    Longitude
                </label>

                <input
                    id="longitude"
                    type="number"
                    step="any"
                    placeholder="2.3522"
                >

            </div>


            <!-- Radius -->

            <div class="field">

                <label for="radius">
                    Radius (km)
                </label>

                <input
                    id="radius"
                    type="number"
                    step="any"
                    placeholder="100"
                >

            </div>


            <!-- Bouton -->

            <button
                class="scan-button"
                onclick="lancerScan()"
            >
                LANCER LE SCAN
            </button>

        </section>


        <!-- ==================================================
             LISTE DES AVIONS
             ================================================== -->

        <section class="aircraft-panel">

            <h2 class="aircraft-title">
                Avions
            </h2>


            <div
                id="aircraft-list"
                class="aircraft-list"
            >

                <div>
                    Aucun avion chargé.
                </div>

            </div>

        </section>


    </aside>


    <!-- ==================================================
         CARTE
         ================================================== -->

    <main class="map-container">

        <div id="map"></div>

    </main>


</div>



<script>


    // ======================================================
    // INITIALISATION DE LA CARTE
    // ======================================================

    const map = L.map("map").setView(
        [48.8566, 2.3522],
        8
    );

    // ======================================================
    // LÉGENDE D'ALTITUDE
    // ======================================================

    const altitudeLegend = L.control({
        position: "bottomright"
    });


    altitudeLegend.onAdd = function(map) {

        const div = L.DomUtil.create(
            "div",
            "altitude-legend"
        );


        div.innerHTML = `

            <div class="altitude-gradient">

                <span
                    class="altitude-tick"
                    style="left: 0%;"
                ></span>

                <span
                    class="altitude-tick"
                    style="left: 3.5%;"
                ></span>

                <span
                    class="altitude-tick"
                    style="left: 7%;"
                ></span>

                <span
                    class="altitude-tick"
                    style="left: 14%;"
                ></span>

                <span
                    class="altitude-tick"
                    style="left: 21.5%;"
                ></span>

                <span
                    class="altitude-tick"
                    style="left: 28.5%;"
                ></span>

                <span
                    class="altitude-tick"
                    style="left: 35.5%;"
                ></span>

                <span
                    class="altitude-tick"
                    style="left: 42.5%;"
                ></span>

                <span
                    class="altitude-tick"
                    style="left: 57.5%;"
                ></span>

                <span
                    class="altitude-tick"
                    style="left: 78%;"
                ></span>

                <span
                    class="altitude-tick"
                    style="left: 100%;"
                ></span>

            </div>


            <div class="altitude-labels">

                <span
                    class="altitude-label first"
                    style="left: 0%;"
                >
                    0
                </span>

                <span
                    class="altitude-label"
                    style="left: 3.5%;"
                >
                    500
                </span>

                <span
                    class="altitude-label"
                    style="left: 7%;"
                >
                    1 000
                </span>

                <span
                    class="altitude-label"
                    style="left: 14%;"
                >
                    2 000
                </span>

                <span
                    class="altitude-label"
                    style="left: 21.5%;"
                >
                    4 000
                </span>

                <span
                    class="altitude-label"
                    style="left: 28.5%;"
                >
                    6 000
                </span>

                <span
                    class="altitude-label"
                    style="left: 35.5%;"
                >
                    8 000
                </span>

                <span
                    class="altitude-label"
                    style="left: 42.5%;"
                >
                    10 000
                </span>

                <span
                    class="altitude-label"
                    style="left: 57.5%;"
                >
                    20 000
                </span>

                <span
                    class="altitude-label"
                    style="left: 78%;"
                >
                    30 000
                </span>

                <span
                    class="altitude-label last"
                >
                    40 000+
                </span>

            </div>
        `;




        // Empêche les clics sur la légende
        // de déplacer la carte

        L.DomEvent.disableClickPropagation(div);


        return div;
    };


    altitudeLegend.addTo(map);



    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);



    // Liste des marqueurs actuellement présents
    let markers = [];



    // ======================================================
    // LANCER LE SCAN
    // ======================================================

    async function lancerScan() {


        // Récupération des valeurs des champs

        const latitude =
            document.getElementById("latitude").value;

        const longitude =
            document.getElementById("longitude").value;

        const radius =
            document.getElementById("radius").value;


        // Vérification simple

        if (
            latitude === "" ||
            longitude === "" ||
            radius === ""
        ) {

            alert("Veuillez remplir les trois champs.");

            return;
        }


        // Désactive le bouton pendant le scan

        const bouton =
            document.querySelector(".scan-button");

        bouton.disabled = true;

        bouton.textContent = "SCAN EN COURS...";


        try {


            // ==================================================
            // REQUÊTE VERS PYTHON
            // ==================================================

            const response = await fetch(

                "/scan?" +

                "latitude=" +
                encodeURIComponent(latitude) +

                "&longitude=" +
                encodeURIComponent(longitude) +

                "&radius=" +
                encodeURIComponent(radius)

            );


            // Vérifie si Python a répondu correctement

            if (!response.ok) {

                throw new Error(
                    "Erreur lors de la requête."
                );

            }


            // Récupération du JSON

            const data =
                await response.json();


            console.log("Réponse Python :", data);


            // ==================================================
            // AFFICHAGE
            // ==================================================

            afficherAvionsCarte(data.avions);

            afficherListeAvions(data.avions);


            // Centre la carte sur la zone demandée

            map.setView(

                [
                    data.latitude,
                    data.longitude
                ],

                8

            );


        } catch (error) {

            console.error(error);

            alert(
                "Une erreur est survenue pendant le scan."
            );

        }


        // Réactive le bouton

        bouton.disabled = false;

        bouton.textContent = "LANCER LE SCAN";

    }

    // ======================================================
    // COULEUR SELON L'ALTITUDE
    // ======================================================

    const altitudeColors = [

        { altitude: 0,     color: [244, 91, 10] },    // orange/rouge
        { altitude: 500,   color: [244, 91, 10] },
        { altitude: 1000,  color: [244, 127, 10] },
        { altitude: 2000,  color: [249, 185, 26] },
        { altitude: 4000,  color: [242, 214, 0] },
        { altitude: 6000,  color: [169, 208, 0] },
        { altitude: 8000,  color: [43, 197, 27] },
        { altitude: 10000, color: [20, 187, 154] },
        { altitude: 20000, color: [28, 188, 210] },
        { altitude: 30000, color: [77, 71, 229] },
        { altitude: 40000, color: [224, 0, 207] }

    ];


    function couleurSelonAltitude(altitude) {

        // Au-dessus de 40 000 m
        if (altitude >= 40000) {

            const c = altitudeColors[altitudeColors.length - 1].color;

            return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
        }


        // En dessous de 0 m
        if (altitude <= 0) {

            const c = altitudeColors[0].color;

            return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
        }


        // Recherche des deux couleurs entre lesquelles
        // l'altitude se trouve

        for (let i = 0; i < altitudeColors.length - 1; i++) {

            const min = altitudeColors[i];
            const max = altitudeColors[i + 1];


            if (
                altitude >= min.altitude &&
                altitude <= max.altitude
            ) {

                // Position entre les deux paliers
                const ratio =
                    (altitude - min.altitude) /
                    (max.altitude - min.altitude);


                // Interpolation RGB

                const r = Math.round(
                    min.color[0] +
                    (max.color[0] - min.color[0]) * ratio
                );

                const g = Math.round(
                    min.color[1] +
                    (max.color[1] - min.color[1]) * ratio
                );

                const b = Math.round(
                    min.color[2] +
                    (max.color[2] - min.color[2]) * ratio
                );


                return `rgb(${r}, ${g}, ${b})`;
            }
        }


        return "black";
    }


    // ======================================================
    // AFFICHER LES AVIONS SUR LA CARTE
    // ======================================================

    function afficherAvionsCarte(avions) {


        // --------------------------------------------------
        // Suppression des anciens marqueurs
        // --------------------------------------------------

        markers.forEach(

            marker => map.removeLayer(marker)

        );

        markers = [];


        // --------------------------------------------------
        // Création des nouveaux marqueurs
        // --------------------------------------------------

        avions.forEach(avion => {


            // true_track fourni par OpenSky
            //
            // 0   = Nord
            // 90  = Est
            // 180 = Sud
            // 270 = Ouest

            const orientation =
                avion["true_track"] ?? 0;

            
            const altitude = avion["geo_altitude"];

            let couleur;

            if (avion["on_ground"] === true) {

                couleur = "black";

            } else if (altitude == null) {

                couleur = "black";

            } else {

                couleur = couleurSelonAltitude(altitude);

            }


            // Création de l'icône

            const avionIcon = L.divIcon({

                className: "avion-icon",

                html: `
                    <div
                        class="avion-image"
                        style="
                            background-color: ${couleur};
                            transform: rotate(${orientation}deg);
                        "
                    ></div>
                `,

                iconSize: [40, 40],

                iconAnchor: [20, 20]

            });



            // Création du marqueur

            const marker = L.marker(

                [
                    avion["latitude"],
                    avion["longitude"]
                ],

                {
                    icon: avionIcon
                }

            ).addTo(map);


            // --------------------------------------------------
            // Popup
            // --------------------------------------------------

            marker.bindPopup(`

                <strong>
                    ${avion["callsign"] || "Inconnu"}
                </strong>

                <br><br>

                Altitude :
                ${avion["altitude"] ?? "N/A"}

                <br>

                Cap :
                ${orientation}°

                <br>

                Latitude :
                ${avion["latitude"]}

                <br>

                Longitude :
                ${avion["longitude"]}

            `);


            // Ajoute le marqueur à notre tableau

            markers.push(marker);

        });

    }



    // ======================================================
    // AFFICHER LA LISTE DES AVIONS
    // ======================================================
    


    function afficherListeAvions(avions) {


        const liste =
            document.getElementById("aircraft-list");


        // Vide la liste

        liste.innerHTML = "";


        // Aucun avion

        if (
            !avions ||
            avions.length === 0
        ) {

            liste.innerHTML = `
                <div>
                    Aucun avion trouvé.
                </div>
            `;

            return;
        }


        // --------------------------------------------------
        // Création d'un élément pour chaque avion
        // --------------------------------------------------

        avions.forEach((avion, index) => {


            const element =
                document.createElement("div");


            element.className =
                "aircraft";


            const callsign =
                avion["callsign"] || "Inconnu";


            const altitude =
                avion["altitude"] ?? "N/A";


            const orientation =
                avion["true_track"] ?? 0;


            element.innerHTML = `

                <div class="aircraft-callsign">

                    ✈ ${callsign}

                </div>

                <div class="aircraft-info">

                    Altitude :
                    ${altitude}

                    <br>

                    Cap :
                    ${orientation}°

                    <br>

                    Position :
                    ${Number(avion["latitude"]).toFixed(4)},
                    ${Number(avion["longitude"]).toFixed(4)}

                </div>

            `;


            // --------------------------------------------------
            // Clic sur un avion dans la liste
            // --------------------------------------------------

            element.onclick = function() {


                const marker =
                    markers[index];


                if (!marker) {
                    return;
                }


                // Centre la carte sur l'avion

                map.setView(

                    [
                        avion["latitude"],
                        avion["longitude"]
                    ],

                    10

                );


                // Ouvre le popup

                marker.openPopup();

            };


            // Ajoute l'avion à la liste

            liste.appendChild(element);

        });

    }


</script>


</body>

</html>
